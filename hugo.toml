baseURL = 'https://www.williamlong.info/'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = '月光博客'
hasCJKLanguage = true
enableRobotsTXT = true
uglyURLs = true
disablePathToLower = true

[taxonomies]
  category = "categories"
  tag = "tags"

[pagination]
  pagerSize = 40
  path = "page"

[params]
  mainSections = ["weibo","google","movie","info","apps"]
  author = "月光"
  description = '月光博客，是专注于业界、互联网、搜索引擎优化、社会化网络、IT技术、谷歌地图、建站、软件等领域的原创IT科技博客，作者龙威廉。'
  keywords = '月光,博客,月光博客,科技博客,IT博客,谷歌地图,谷歌地球'
  image_cdn = 'https://static.williamlong.info'
  # 分页页码折叠：当前页左右各显示多少个页码
  pagerWindow = 4

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
home = ["HTML","RSS"]
section = ["HTML","RSS"]
# 词条页不用 Hugo 原生 term 页：原生 term 是全局的，无法做到分区隔离。
# 六个分区的 tag/cat 页统一由 content/_content.gotmpl 生成。
taxonomy = []
term = []

[outputFormats.RSS]
baseName = "rss"

[services.rss]
limit = 20

[related]
  threshold = 1
  includeNewer = true
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 50

[markup.highlight]
  # 直接把配色写进 HTML，省掉额外的 Chroma 样式文件
  # friendly 是浅色配色，和 SimplePro 的蓝白主题一致
  style = "friendly"
  noClasses = true
  guessSyntax = true