baseURL = 'https://www.williamlong.info/'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = '月光博客'
hasCJKLanguage = true
enableRobotsTXT = true
uglyURLs = true
disablePathToLower = true

[taxonomies]
  category = "categories"
  tag = "tags"

[pagination]
  pagerSize = 50
  path = "page"

[params]
  mainSections = ["weibo","google","movie","info","apps"]
  author = "月光"
  description = '月光博客，是专注于业界、互联网、搜索引擎优化、社会化网络、IT技术、谷歌地图、建站、软件等领域的原创IT科技博客，作者龙威廉。'
  keywords = '月光,博客,月光博客,科技博客,IT博客,谷歌地图,谷歌地球'
  image_cdn = 'https://static.williamlong.info'

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
home = ["HTML","RSS"]
section = ["HTML","RSS"]
taxonomy = []
term = ["HTML"]

[outputFormats.RSS]
baseName = "rss"

[services.rss]
limit = 20