# 搜索栏配置
# 切换引擎只改 default；增删引擎只改 engines，模板不用动。
#
# default  当前使用的引擎 id（表单的 action 与参数名都由它决定）
# site     全站限定条件；当前引擎的 site 为 true 时才拼 "site:这段内容"
# engines  引擎列表
#   id     唯一标识
#   name   引擎名称（仅备注，页面不再显示下拉框）
#   url    查询地址模板，{q} 只用于拼出 action（查询串会被去掉）
#   param  查询参数名，即输入框的 name
#   site   是否加 site: 限定。不支持 site: 的引擎设为 false，只按关键词搜索
default: baidu
site: williamlong.info
engines:
  - id: bing
    name: Bing
    url: "https://cn.bing.com/search?q={q}"
    param: q
    site: true
  - id: google
    name: Google
    url: "https://www.google.com/search?q={q}"
    param: q
    site: true
  - id: baidu
    name: 百度
    url: "https://www.baidu.com/s?wd={q}"
    param: wd
    site: true
